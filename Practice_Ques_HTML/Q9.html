<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PQ 9 - Complex Form</title>
</head>
<body>
    
    <form>
        <h2>Job Application</h2>

        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Name: </label>
            <input type="text" id="name" name="name">
            <br><br>

            <label for="mail">Email: </label>
            <input type="email" id="mail" name="mail">
            <br><br>

            <label for="phone">Phone No: </label>
            <input type="tel" id="phone" name="phone">
            <br><br>

            <label for="dob">Date of Birth: </label>
            <input type="date" id="dob" name="dob">
            <br><br>

            <span>Gender: </span>
            <input type="radio" id="female" name="gender">
            <label for="female">Female</label>
            <input type="radio" id="male" name="gender">
            <label for="male">Male</label>
            <input type="radio" id="others" name="gender">
            <label for="others">Others</label>
            <br><br>

            <label for="experience">Experience: </label>
            <input type="number" min="0" id="experience" name="experience">
            <br><br>
            <label for="resume">Resume: </label>
            <input type="file" id="resume" name="resume">

        </fieldset>
        <br>

        <fieldset>
            <legend>Address</legend>

            <label for="street">Street:</label>
            <input type="text" id="street" name="street">
            <br><br>

            <label for="city">City: </label>
            <input type="text" id="city" name="city">
            <br><br>

            <label for="state">State: </label>
            <input type="text" id="state" name="state">
            <br><br>

            <label for="zip_code">Zip Code: </label>
            <input type="text" id="zip_code" name="zip_code">
            <br><br>

            <label for="country">Country: </label>
            <select name="country" id="country">
                <option value="select" disabled selected>Select</option>
                <option value="german">German</option>
                <option value="india">India</option>
                <option value="newyork">Newyork</option>
                <option value="singapora">Singapora</option>
                <option value="USA">USA</option>
            </select>

        </fieldset>
        <br>

        <fieldset>
            <Legend>Other Information</Legend>
  
            <label for="comments">Comments: </label>
            <br>
            <textarea name="comments" id="comments" placeholder="type here" rows="10px" cols="30px"></textarea>
            <br><br>

            <input type="checkbox" id="terms" name="terms">
            <label for="terms">I agree to the terms of service</label>
            
        </fieldset>
        <br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
