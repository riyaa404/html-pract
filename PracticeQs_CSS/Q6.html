<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6 - create and style the traffic signal element using box model concepts</title>

    <style>
        /* css style for traffic signal element */
        .outerDiv{
            height: 200px;
            width: 70px;
            border: 2px solid black;
        }

        .innerDiv{
            height: 50px;
            width: 50px;
            border: 2px solid black;
            margin: 10px;
            border-radius: 50%;
            /* padding: 3px; */
        }

        #display1{
            background-color: red;
        }
        #display2{
            background-color: yellow;
        }
        #display3{
            background-color: green;
        }

    </style>
</head>

<body>
    
    <div class="outerDiv">
        <div class="innerDiv" id="display1"></div>
        <div class="innerDiv" id="display2"></div>
        <div class="innerDiv" id="display3"></div>
    </div>

</body>
</html>
